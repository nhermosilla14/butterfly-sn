name: Release

# Every push to main publishes a release: the next patch version, the three self-contained
# binaries and their checksums.

on:
  push:
    branches: [main]

permissions:
  contents: write

# Serialise releases: two merges in quick succession must not compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version bump
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            butterfly-mqtt-client/go.sum
      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.54.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Pick the next version
        id: version
        run: echo "version=$(task next-version)" >> "$GITHUB_OUTPUT"
      - run: task test
      - run: task dist
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --target "$GITHUB_SHA" --generate-notes
