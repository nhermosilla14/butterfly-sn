# Example configuration for butterfly-sn. Copy it and run: butterfly-sn -config config.yaml
# Unknown keys are rejected at startup.

# UDP address the MQTT-SN clients send to (host:port).
listen: 0.0.0.0:5684

# MQTT broker TCP address (host:port). Each client gets its own connection to it.
broker: 127.0.0.1:1883

# Maximum number of simultaneous client sessions. Default: 100. Must be greater than 0.
max_clients: 100

# Log level: debug, info, warn or error. Default: info.
log_level: info

# Gateway id (1-255) sent in GWINFO replies and ADVERTISE. Default: 1.
gateway_id: 1

# Seconds between ADVERTISE messages (0-65535). Default: 900. 0 disables advertisement.
# The first one is sent after one full interval.
# advertise_interval: 900

# UDP address (host:port) ADVERTISE is sent to. Default: 255.255.255.255 on the listen port (broadcast).
# advertise_address: 255.255.255.255:5684

# Seconds between retransmissions of an unanswered REGISTER or PUBLISH sent to a client. Default: 10.
# Must be greater than 0.
# retry_interval: 10

# Retransmissions before the client is declared lost. Also bounds (interval x limit) how long a SUBSCRIBE or
# UNSUBSCRIBE may wait for the broker. Default: 5. Must be greater than 0.
# retry_limit: 5
