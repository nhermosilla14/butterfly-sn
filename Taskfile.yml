version: '3'

# Build, test and release helpers. `task --list` shows the public tasks; the ones marked
# `internal: true` are steps reused by others. Override VERSION, DIST or BIN on the command line:
# `task dist VERSION=v1.2.3`.

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  DIST: dist
  BIN: bin
  HOSTARCH:
    sh: uname -m | sed -e 's/x86_64/amd64/' -e 's/aarch64/arm64/'
  PKG: github.com/nhermosilla14/butterfly-sn
  LDFLAGS: -s -w -X {{.PKG}}/internal/app.Version={{.VERSION}}
  GOBUILD: -trimpath -buildvcs=false -ldflags "{{.LDFLAGS}}"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  help:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  version:
    desc: Print the resolved version
    cmds:
      - echo "{{.VERSION}}"
    silent: true

  build:
    desc: Host binary in bin/
    env:
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p "{{.BIN}}"
      - go build {{.GOBUILD}} -o "{{.BIN}}/butterfly-sn" ./cmd/butterfly-sn

  dist:
    desc: Cross-built binaries, archives and SHA256SUMS in dist/
    env:
      CGO_ENABLED: '0'
    cmds:
      - rm -rf "{{.DIST}}"
      - mkdir -p "{{.DIST}}"
      - |
        set -e
        for t in linux/amd64 linux/arm64 windows/amd64; do
          os=${t%/*} arch=${t#*/} ext=""
          if [ "$os" = windows ]; then ext=.exe; fi
          name="butterfly-sn_{{.VERSION}}_${os}_${arch}"
          GOOS=$os GOARCH=$arch go build {{.GOBUILD}} -o "{{.DIST}}/$os-$arch/butterfly-sn$ext" ./cmd/butterfly-sn
          stage="{{.DIST}}/.stage/$name"
          mkdir -p "$stage"
          cp "{{.DIST}}/$os-$arch/butterfly-sn$ext" LICENSE config.example.yaml "$stage/"
          chmod 755 "$stage" "$stage/butterfly-sn$ext"
          chmod 644 "$stage/LICENSE" "$stage/config.example.yaml"
          if [ "$os" = windows ]; then
            find "$stage" -exec touch -d '2020-01-01 00:00:00 UTC' {} +
            (cd "{{.DIST}}/.stage" && find "$name" | LC_ALL=C sort | TZ=UTC zip -X -q "../$name.zip" -@)
          else
            (cd "{{.DIST}}/.stage" && tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 \
              --numeric-owner -cf - "$name" | gzip -n > "../$name.tar.gz")
          fi
        done
      - rm -rf "{{.DIST}}/.stage"
      - |
        cd "{{.DIST}}"
        sha256sum butterfly-sn_*.tar.gz butterfly-sn_*.zip | LC_ALL=C sort -k2 > SHA256SUMS

  image:
    desc: Multi-arch (amd64, arm64) scratch image butterfly-sn:<version>, built with podman
    deps: [dist]
    cmds:
      - task: require-dist
      - |
        podman manifest rm "butterfly-sn:{{.VERSION}}" >/dev/null 2>&1 \
          || podman rmi "butterfly-sn:{{.VERSION}}" >/dev/null 2>&1 || true
      - podman build --platform linux/amd64,linux/arm64 --manifest "butterfly-sn:{{.VERSION}}" --build-arg VERSION={{.VERSION}} .

  image-test:
    desc: Build the host-arch image and smoke-test it with podman (no Docker)
    deps: [dist]
    cmds:
      - task: require-dist
      - |
        img="butterfly-sn-test:{{.VERSION}}-$$"
        podman build --platform linux/{{.HOSTARCH}} -t "$img" --build-arg VERSION={{.VERSION}} . \
          || { podman rmi -f "$img" >/dev/null 2>&1; exit 1; }
        BUTTERFLY_SN_IMAGE="$img" BUTTERFLY_SN_IMAGE_VERSION="{{.VERSION}}" \
          go test -tags image -count=1 -v ./test/image/...
        rc=$?
        podman rmi -f "$img" >/dev/null 2>&1
        exit $rc

  require-dist:
    internal: true
    cmds:
      - |
        if [ "{{.DIST}}" != dist ]; then
          echo "DIST must be 'dist' (the Dockerfile copies from dist/), got '{{.DIST}}'" >&2
          exit 1
        fi

  test:
    desc: Formatting, vet, build and tests (code checks only)
    cmds:
      - task: fmt-check
      - go vet ./...
      - go build ./...
      - go test -race -count=1 ./...
      - task: test-client

  fmt-check:
    internal: true
    cmds:
      - |
        out=$(gofmt -l . butterfly-mqtt-client)
        if [ -n "$out" ]; then
          echo "gofmt needed:"
          echo "$out"
          exit 1
        fi

  test-client:
    internal: true
    dir: butterfly-mqtt-client
    cmds:
      - go vet ./...
      - go build ./...
      - go test -race -count=1 ./...

  check-docs:
    desc: Merge gate (docs/branch must be empty; fails while branch records exist)
    cmds:
      - sh scripts/check-branch-docs.sh

  check:
    desc: Tests plus the merge gate for docs/branch
    cmds:
      - task: test
      - task: check-docs

  clean:
    desc: Remove dist/ and bin/
    cmds:
      - rm -rf "{{.DIST}}" "{{.BIN}}"
